<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — RewardPulse</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #090e17; color: #f8fafc; line-height: 1.8; margin: 0; padding: 40px 20px; }
    .wrapper { max-width: 650px; margin: 0 auto; background: #0f172a; padding: 40px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); }
    h1 { color: #38bdf8; font-size: 30px; margin-bottom: 10px; }
    p { color: #94a3b8; font-size: 15px; margin-bottom: 25px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 12px; background: #141f36; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-family: inherit; font-size: 14px; box-sizing: border-box; }
    textarea { height: 120px; resize: vertical; }
    .btn-submit { width: 100%; padding: 14px; background: #10b981; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 15px; }
    .btn-back { display: inline-block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Contact Support</h1>
    <p>Have questions about survey qualification, campaign status, or token redemption? Fill out the inquiry form below.</p>

    <form onsubmit="event.preventDefault(); alert('Thank you. Your message has been routed to our verification support desk.');">
      <div class="field">
        <label>Full Name</label>
        <input type="text" placeholder="John Doe" required>
      </div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" placeholder="john@example.com" required>
      </div>
      <div class="field">
        <label>Selected Offer Inquiry</label>
        <input type="text" placeholder="e.g. Costco $750 or Zelle $750">
      </div>
      <div class="field">
        <label>Message</label>
        <textarea placeholder="Describe your question or issue in detail..." required></textarea>
      </div>
      <button type="submit" class="btn-submit">Submit Inquiry</button>
    </form>

    <a href="index.html" class="btn-back">&larr; Return to Home</a>
  </div>
</body>
</html>
